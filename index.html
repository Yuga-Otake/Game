<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>マインスイーパー</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e2430">
<meta name="description" content="ブラウザで遊べるマインスイーパー">

<!-- ホーム画面に追加したときにアプリとして起動するための指定 (iOS) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="マインスイーパー">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  /* 変数に対応していない古いブラウザ向けに、各所で素の色を先に書いてから var() で上書きする */
  :root {
    --bg: #1e2430;
    --panel: #2a3240;
    --cell: #4a5568;
    --cell-hi: #5a6578;
    --open: #d8dde5;
    --open-alt: #ccd2dc;
    --line: #1a1f29;
    --text: #e8ecf2;
    --accent: #ffcc44;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #1e2430;
    background: var(--bg);
    color: #e8ecf2;
    color: var(--text);
    font-family: "Helvetica Neue", Arial, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  body {
    text-align: center;
    padding: 16px 12px 32px;
    /* ホーム画面から起動したときにステータスバーと重ならないようにする */
    padding-top: calc(16px + constant(safe-area-inset-top));
    padding-top: calc(16px + env(safe-area-inset-top));
  }
  h1 {
    font-size: 20px;
    letter-spacing: .08em;
    margin: 4px 0 14px;
    font-weight: 600;
  }

  /* 見出し・操作パネルは inline-block で組む (Flexbox/Grid に依存しない) */
  .levels { margin: 0 0 14px; }
  .levels button {
    display: inline-block;
    background: #2a3240;
    background: var(--panel);
    color: #e8ecf2;
    color: var(--text);
    border: 1px solid #3c4657;
    border-radius: 8px;
    padding: 7px 14px;
    margin: 0 4px 6px;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }
  .levels button.active {
    background: #ffcc44;
    background: var(--accent);
    color: #23282f;
    border-color: #ffcc44;
    border-color: var(--accent);
    font-weight: 700;
  }

  .status {
    display: inline-block;
    background: #2a3240;
    background: var(--panel);
    border-radius: 10px;
    padding: 8px 14px;
    margin: 0 0 14px;
    white-space: nowrap;
  }
  .status > * { display: inline-block; vertical-align: middle; }
  .counter {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .05em;
    min-width: 74px;
    text-align: center;
  }
  #reset {
    font-size: 24px;
    line-height: 1;
    background: #4a5568;
    background: var(--cell);
    border: none;
    border-radius: 8px;
    width: 46px;
    height: 40px;
    margin: 0 10px;
    cursor: pointer;
    padding: 0;
  }
  #reset:active { background: #5a6578; background: var(--cell-hi); }

  .board-wrap { overflow: auto; max-width: 100%; -webkit-overflow-scrolling: touch; }

  /* 盤面は table で組む。CSS Grid 非対応の古い Safari でも必ず格子になる */
  #board {
    table-layout: fixed;          /* 幅を詰められて盤面が歪むのを防ぐ */
    border-collapse: separate;
    border-spacing: 2px;
    margin: 0 auto;
    background: #1a1f29;
    background: var(--line);
    padding: 2px;
    border-radius: 6px;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;   /* 長押しでコピーメニューが出るのを防ぐ */
  }
  .cell {
    height: 30px;
    padding: 0;
    border-radius: 3px;
    background: #4a5568;
    background: var(--cell);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    font-family: inherit;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
  }
  .cell.open {
    background: #d8dde5;
    background: var(--open);
    cursor: default;
  }
  .cell.open.even { background: #ccd2dc; background: var(--open-alt); }
  .cell.mine { background: #d9534f; }
  .cell.mine-hit { background: #ff3b30; }
  .cell.wrong { background: #8a5a5a; }
  .c1 { color: #1976d2; } .c2 { color: #2e7d32; } .c3 { color: #d32f2f; }
  .c4 { color: #512da8; } .c5 { color: #a1450d; } .c6 { color: #00838f; }
  .c7 { color: #37474f; } .c8 { color: #757575; }

  .message { font-size: 15px; min-height: 22px; font-weight: 600; margin: 14px 0 0; }
  .message.win { color: #7ee08a; }
  .message.lose { color: #ff8a80; }
  .help { font-size: 12px; color: #97a1b2; line-height: 1.7; margin: 10px auto 0; max-width: 340px; }

</style>
</head>
<body>
  <h1>マインスイーパー</h1>

  <div class="levels" id="levels"></div>

  <div class="status">
    <div class="counter" id="mines">💣 0</div>
    <button id="reset" title="リセット" type="button">🙂</button>
    <div class="counter" id="timer">⏱ 0</div>
  </div>

  <div class="board-wrap"><table id="board"><tbody id="board-body"></tbody></table></div>

  <p class="message" id="message"></p>

  <p class="help">
    左クリック: 開く / 右クリック: 旗 🚩<br>
    数字マスをクリック: 周囲の旗が足りていれば一斉に開く<br>
    スマホ: タップで開く / 長押しで旗
  </p>

<script>
(function () {
  "use strict";

  var LEVELS = [
    { key: "easy",   label: "初級 9×9",   rows: 9,  cols: 9,  mines: 10 },
    { key: "normal", label: "中級 16×16", rows: 16, cols: 16, mines: 40 },
    { key: "hard",   label: "上級 16×30", rows: 16, cols: 30, mines: 99 }
  ];

  var boardEl   = document.getElementById("board");
  var bodyEl    = document.getElementById("board-body");
  var minesEl   = document.getElementById("mines");
  var timerEl   = document.getElementById("timer");
  var resetEl   = document.getElementById("reset");
  var messageEl = document.getElementById("message");
  var levelsEl  = document.getElementById("levels");

  var level = "easy";
  var rows, cols, mineCount;
  var mine, open, flag, count;   // 盤面データ (1次元配列)
  var cells;                     // DOM 要素
  var started, over, openedCount, flagCount;
  var timerId = null, elapsed = 0;

  function levelConfig(key) {
    for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].key === key) return LEVELS[i];
    return LEVELS[0];
  }

  // ---- 盤面の生成 ------------------------------------------------------
  function idx(r, c) { return r * cols + c; }

  function forEachNeighbor(i, fn) {
    var r = (i / cols) | 0, c = i % cols;
    for (var dr = -1; dr <= 1; dr++) {
      for (var dc = -1; dc <= 1; dc++) {
        if (dr === 0 && dc === 0) continue;
        var nr = r + dr, nc = c + dc;
        if (nr < 0 || nr >= rows || nc < 0 || nc >= cols) continue;
        fn(idx(nr, nc));
      }
    }
  }

  function newGame() {
    var cfg = levelConfig(level);
    rows = cfg.rows; cols = cfg.cols; mineCount = cfg.mines;

    var n = rows * cols;
    mine  = new Uint8Array(n);
    open  = new Uint8Array(n);
    flag  = new Uint8Array(n);
    count = new Uint8Array(n);

    started = false;
    over = false;
    openedCount = 0;
    flagCount = 0;

    stopTimer();
    elapsed = 0;

    resetEl.innerHTML = "🙂";
    messageEl.innerHTML = "";
    messageEl.className = "message";

    render();
    updateStatus();
  }

  // 最初のクリックとその周囲には地雷を置かない
  function placeMines(safeIndex) {
    var n = rows * cols;
    var safe = {};
    safe[safeIndex] = true;
    forEachNeighbor(safeIndex, function (j) { safe[j] = true; });

    var pool = [];
    for (var i = 0; i < n; i++) if (!safe[i]) pool.push(i);

    // 置ける枠が足りない場合 (極小盤) は置ける分だけにする
    var toPlace = Math.min(mineCount, pool.length);

    for (var k = 0; k < toPlace; k++) {
      var pick = k + Math.floor(Math.random() * (pool.length - k));
      var tmp = pool[k]; pool[k] = pool[pick]; pool[pick] = tmp;
      mine[pool[k]] = 1;
    }

    for (var m = 0; m < n; m++) {
      if (mine[m]) continue;
      var c = 0;
      forEachNeighbor(m, function (j) { if (mine[j]) c++; });
      count[m] = c;
    }
  }

  // ---- 描画 ------------------------------------------------------------
  function render() {
    while (bodyEl.firstChild) bodyEl.removeChild(bodyEl.firstChild);
    cells = new Array(rows * cols);

    var frag = document.createDocumentFragment();
    for (var r = 0; r < rows; r++) {
      var tr = document.createElement("tr");
      for (var c = 0; c < cols; c++) {
        var i = idx(r, c);
        var td = document.createElement("td");
        td.className = "cell";
        td.setAttribute("data-i", i);
        cells[i] = td;
        tr.appendChild(td);
      }
      frag.appendChild(tr);
    }
    bodyEl.appendChild(frag);
    applyBoardSize();
  }

  // table-layout: fixed なので、表全体の幅を決めれば列幅も決まる。
  // 画面が狭いときだけマスを小さくし、入りきらない分は横スクロールで見せる。
  function cellSize() {
    return (window.innerWidth || 1024) <= 480 ? 26 : 30;
  }

  function applyBoardSize() {
    var s = cellSize();
    boardEl.style.width = (cols * s + (cols + 1) * 2) + "px";
    for (var i = 0; i < cells.length; i++) {
      cells[i].style.height = s + "px";
      cells[i].style.fontSize = Math.round(s * 0.53) + "px";
    }
  }

  function paint(i) {
    var el = cells[i];
    var cls = "cell";
    var text = "";

    if (open[i]) {
      cls += " open";
      var r = (i / cols) | 0, c = i % cols;
      if ((r + c) % 2 === 0) cls += " even";
      if (mine[i]) {
        cls += " mine";
        text = "💣";
      } else if (count[i] > 0) {
        cls += " c" + count[i];
        text = String(count[i]);
      }
    } else if (flag[i]) {
      text = "🚩";
    }

    el.className = cls;
    el.innerHTML = text;
  }

  function updateStatus() {
    minesEl.innerHTML = "💣 " + (mineCount - flagCount);
    timerEl.innerHTML = "⏱ " + elapsed;
  }

  // ---- タイマー --------------------------------------------------------
  function startTimer() {
    if (timerId !== null) return;
    timerId = setInterval(function () {
      elapsed++;
      if (elapsed > 999) elapsed = 999;
      updateStatus();
    }, 1000);
  }

  function stopTimer() {
    if (timerId !== null) { clearInterval(timerId); timerId = null; }
  }

  // ---- ゲーム操作 ------------------------------------------------------
  function reveal(i) {
    if (over || open[i] || flag[i]) return;

    if (!started) {
      started = true;
      placeMines(i);
      startTimer();
    }

    if (mine[i]) {
      open[i] = 1;
      paint(i);
      cells[i].className += " mine-hit";
      lose();
      return;
    }

    // 空きマスは連鎖的に開く
    var stack = [i];
    while (stack.length) {
      var cur = stack.pop();
      if (open[cur] || flag[cur]) continue;
      open[cur] = 1;
      openedCount++;
      paint(cur);
      if (count[cur] === 0) {
        forEachNeighbor(cur, function (j) {
          if (!open[j] && !flag[j] && !mine[j]) stack.push(j);
        });
      }
    }

    checkWin();
  }

  function toggleFlag(i) {
    if (over || open[i]) return;
    flag[i] = flag[i] ? 0 : 1;
    flagCount += flag[i] ? 1 : -1;
    paint(i);
    updateStatus();
  }

  // 数字マスのコード打ち (周囲の旗が数字と一致したら残りを開く)
  function chord(i) {
    if (over || !open[i] || count[i] === 0) return;

    var flags = 0;
    forEachNeighbor(i, function (j) { if (flag[j]) flags++; });
    if (flags !== count[i]) return;

    var targets = [];
    forEachNeighbor(i, function (j) { if (!flag[j] && !open[j]) targets.push(j); });
    for (var k = 0; k < targets.length; k++) {
      reveal(targets[k]);
      if (over) return;
    }
  }

  function lose() {
    over = true;
    stopTimer();
    for (var i = 0; i < mine.length; i++) {
      if (mine[i] && !flag[i]) {
        open[i] = 1;
        paint(i);
      } else if (!mine[i] && flag[i]) {
        cells[i].className += " wrong";
        cells[i].innerHTML = "✖";
      }
    }
    resetEl.innerHTML = "😵";
    messageEl.innerHTML = "ドカン！ 地雷を踏みました";
    messageEl.className = "message lose";
  }

  function checkWin() {
    if (openedCount !== rows * cols - mineCount) return;
    over = true;
    stopTimer();
    for (var i = 0; i < mine.length; i++) {
      if (mine[i] && !flag[i]) { flag[i] = 1; flagCount++; paint(i); }
    }
    updateStatus();
    resetEl.innerHTML = "😎";
    messageEl.innerHTML = "クリア！ タイム " + elapsed + " 秒";
    messageEl.className = "message win";
  }

  // ---- 入力 ------------------------------------------------------------
  // Element.closest がない古いブラウザでも動くように自前で親をたどる
  function cellIndexFrom(node) {
    while (node && node !== boardEl) {
      if (node.nodeType === 1 && node.getAttribute) {
        var v = node.getAttribute("data-i");
        if (v !== null) return Number(v);
      }
      node = node.parentNode;
    }
    return -1;
  }

  boardEl.onclick = function (e) {
    if (longPressFired) { longPressFired = false; return; }
    var i = cellIndexFrom((e || window.event).target || (e || window.event).srcElement);
    if (i < 0) return;
    if (open[i]) chord(i); else reveal(i);
  };

  boardEl.oncontextmenu = function (e) {
    e = e || window.event;
    if (e.preventDefault) e.preventDefault();
    var i = cellIndexFrom(e.target || e.srcElement);
    if (i >= 0) toggleFlag(i);
    return false;
  };

  // スマホ: 長押しで旗
  var pressTimer = null, longPressFired = false;

  boardEl.addEventListener("touchstart", function (e) {
    var i = cellIndexFrom(e.target);
    if (i < 0) return;
    longPressFired = false;
    pressTimer = setTimeout(function () {
      longPressFired = true;
      toggleFlag(i);
    }, 400);
  }, false);

  function cancelPress() {
    if (pressTimer !== null) { clearTimeout(pressTimer); pressTimer = null; }
  }
  boardEl.addEventListener("touchend", cancelPress, false);
  boardEl.addEventListener("touchmove", function () {
    cancelPress();
    longPressFired = false;
  }, false);
  boardEl.addEventListener("touchcancel", function () {
    cancelPress();
    longPressFired = false;
  }, false);

  resetEl.onclick = newGame;

  window.onresize = function () { if (cells) applyBoardSize(); };

  // ---- 難易度ボタン ----------------------------------------------------
  for (var li = 0; li < LEVELS.length; li++) {
    (function (cfg) {
      var b = document.createElement("button");
      b.type = "button";
      b.innerHTML = cfg.label;
      b.setAttribute("data-level", cfg.key);
      if (cfg.key === level) b.className = "active";
      b.onclick = function () {
        level = cfg.key;
        var bs = levelsEl.getElementsByTagName("button");
        for (var k = 0; k < bs.length; k++) {
          bs[k].className = bs[k].getAttribute("data-level") === cfg.key ? "active" : "";
        }
        newGame();
      };
      levelsEl.appendChild(b);
    })(LEVELS[li]);
  }

  newGame();

  // オフラインでも遊べるようにする (未対応のブラウザでは何も起きない)
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
})();
</script>
</body>
</html>
