<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>かんたん ゲーム</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6efdd">
<meta name="description" content="もぐらたたきと しんけいすいじゃくが あそべます">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="かんたんゲーム">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
  /* 古いブラウザでも崩れないように、Flexbox と CSS Grid は使わない。
     色は CSS 変数に対応しない環境のために素の色を先に書いてから var() で上書きする。 */
  :root {
    --bg: #f6efdd;
    --panel: #ffffff;
    --text: #2f2a24;
    --sub: #6d6355;
    --line: #d9cdb2;
    --accent: #e07a2f;
    --good: #3f8f4f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #f6efdd;
    background: var(--bg);
    color: #2f2a24;
    color: var(--text);
    font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    text-align: center;
    padding: 14px 12px 40px;
    padding-top: calc(14px + constant(safe-area-inset-top));
    padding-top: calc(14px + env(safe-area-inset-top));
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }

  /* 右上の音ボタンに文字がかぶらないよう、左右に同じ余白をとる */
  h1 { font-size: 24px; margin: 2px 0 12px; padding: 0 70px; font-weight: 700; letter-spacing: .04em; }
  @media (max-width: 380px) {
    h1 { font-size: 20px; padding: 0 64px; }
    #sound { width: 56px; height: 52px; font-size: 21px; }
  }

  /* ---- 音のオン・オフ ---- */
  #sound {
    position: absolute;
    right: 12px;
    top: 10px;
    top: calc(10px + constant(safe-area-inset-top));
    top: calc(10px + env(safe-area-inset-top));
    font-family: inherit;
    font-size: 24px;
    line-height: 1;
    width: 62px;
    height: 56px;
    padding: 0;
    background: #ffffff;
    background: var(--panel);
    border: 3px solid #d9cdb2;
    border: 3px solid var(--line);
    border-radius: 14px;
    cursor: pointer;
  }

  /* ---- タブ ---- */
  .tabs { margin: 0 0 10px; }
  .tab {
    display: inline-block;
    font-family: inherit;
    font-size: 21px;
    font-weight: 700;
    color: #6d6355;
    color: var(--sub);
    background: #ffffff;
    background: var(--panel);
    border: 3px solid #d9cdb2;
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 14px 20px;
    margin: 0 5px 8px;
    min-width: 190px;
    min-height: 64px;
    cursor: pointer;
  }
  .tab.active {
    background: #e07a2f;
    background: var(--accent);
    border-color: #e07a2f;
    border-color: var(--accent);
    color: #fff;
  }

  /* ---- はなまるの記録 ---- */
  .stamps {
    font-size: 17px;
    color: #6d6355;
    color: var(--sub);
    margin: 0 0 14px;
    min-height: 26px;
  }
  .stamps .marks { font-size: 22px; letter-spacing: .06em; }

  /* ---- 共通パーツ ---- */
  .score { font-size: 24px; font-weight: 700; margin: 0 0 12px; }
  .score b { color: #e07a2f; color: var(--accent); font-size: 30px; }
  .msg {
    font-size: 26px;
    font-weight: 700;
    color: #3f8f4f;
    color: var(--good);
    min-height: 38px;
    margin: 16px 0 6px;
  }
  .big {
    font-family: inherit;
    font-size: 21px;
    font-weight: 700;
    color: #2f2a24;
    color: var(--text);
    background: #ffffff;
    background: var(--panel);
    border: 3px solid #d9cdb2;
    border: 3px solid var(--line);
    border-radius: 14px;
    padding: 14px 24px;
    margin: 6px 4px 0;
    min-height: 62px;
    cursor: pointer;
  }
  .big:active { background: #f0e6cd; }
  .big.on {
    background: #e07a2f;
    background: var(--accent);
    border-color: #e07a2f;
    border-color: var(--accent);
    color: #fff;
  }
  .big.icon { font-size: 28px; padding: 10px 18px; min-width: 76px; }

  .ctrl { margin: 0 0 10px; }
  .ctrl .label {
    display: inline-block;
    font-size: 17px;
    color: #6d6355;
    color: var(--sub);
    margin: 0 6px 0 0;
    vertical-align: middle;
  }
  .ctrl .big { margin-top: 0; margin-bottom: 6px; vertical-align: middle; }
  .note { font-size: 16px; color: #6d6355; color: var(--sub); margin: 18px 0 0; line-height: 1.7; }

  table.board {
    table-layout: fixed;      /* 列幅を詰められて歪むのを防ぐ */
    border-collapse: separate;
    border-spacing: 10px;
    margin: 0 auto;
  }

  /* ---- もぐらたたき ---- */
  .hole {
    background: #cbbb95;
    border-radius: 50%;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
    position: relative;
    border: 5px solid #b5a279;
  }
  .hole .mole { visibility: hidden; }
  .hole.up .mole { visibility: visible; }
  .hole.up { background: #d9c8a0; }
  .hole.gold { background: #ffe9a8; border-color: #e8b53c; }
  .hole .pop {
    position: absolute;
    left: 0;
    right: 0;
    top: 2px;
    color: #3f8f4f;
    color: var(--good);
    font-weight: 700;
    visibility: hidden;
  }
  .hole.hit { background: #dff0dd; border-color: #8cc094; }
  .hole.hit .pop { visibility: visible; }

  /* ---- しんけいすいじゃく ---- */
  .card {
    background: #e8a05a;
    border: 5px solid #cf8842;
    border-radius: 14px;
    text-align: center;
    vertical-align: middle;
    cursor: pointer;
  }
  .card .face { visibility: hidden; }
  .card.open, .card.done {
    background: #ffffff;
    background: var(--panel);
    border-color: #d9cdb2;
    border-color: var(--line);
  }
  .card.open .face, .card.done .face { visibility: visible; }
  .card.done { background: #dff0dd; border-color: #8cc094; }

  /* ---- おいわいの紙ふぶき ---- */
  #confetti { position: fixed; left: 0; top: 0; width: 100%; height: 0; z-index: 50; }
  #confetti span { position: fixed; }
</style>
</head>
<body>

<button type="button" id="sound" title="おと">🔊</button>

<h1>かんたん ゲーム</h1>

<div class="tabs">
  <button type="button" class="tab active" id="tab-mogura">🐹 もぐらたたき</button>
  <button type="button" class="tab" id="tab-memory">🎴 しんけいすいじゃく</button>
</div>

<p class="stamps" id="stamps"></p>

<!-- もぐらたたき -->
<div id="game-mogura">
  <p class="score">たたいた かず　<b id="mogura-score">0</b> / 10</p>
  <div class="ctrl"><span class="label">はやさ</span><span id="mogura-speeds"></span></div>
  <table class="board" id="mogura-board"><tbody id="mogura-body"></tbody></table>
  <p class="msg" id="mogura-msg"></p>
  <button type="button" class="big" id="mogura-reset">もういちど</button>
  <p class="note">もぐらが でてきたら ゆびで さわってください。<br>いそがなくて だいじょうぶです。<br>ときどき <b>きんのもぐら</b> が でてきます（3ぴきぶん）。</p>
</div>

<!-- しんけいすいじゃく -->
<div id="game-memory" style="display:none">
  <p class="score">めくった かいすう　<b id="memory-score">0</b></p>
  <div class="ctrl"><span class="label">まいすう</span><span id="memory-sizes"></span></div>
  <div class="ctrl"><span class="label">えがら</span><span id="memory-themes"></span></div>
  <table class="board" id="memory-board"><tbody id="memory-body"></tbody></table>
  <p class="msg" id="memory-msg"></p>
  <button type="button" class="big" id="memory-reset">もういちど</button>
  <p class="note">カードを 2まい めくって、<br>おなじ えを さがしてください。</p>
</div>

<div id="confetti"></div>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function onTap(el, fn) { el.onclick = fn; }

  // 古い環境やプライベートブラウズでも落ちないように、保存は必ず try で包む
  function load(key, dflt) {
    try {
      var v = window.localStorage.getItem("asobi-" + key);
      return v === null ? dflt : v;
    } catch (e) { return dflt; }
  }
  function save(key, value) {
    try { window.localStorage.setItem("asobi-" + key, String(value)); } catch (e) {}
  }

  function fitSize(cols, max, spacing) {
    var vw = window.innerWidth || document.documentElement.clientWidth || 768;
    var avail = Math.min(vw - 20, 620);
    var s = Math.floor((avail - (cols + 1) * spacing) / cols);
    if (s > max) s = max;
    if (s < 54) s = 54;
    return s;
  }

  // ============================================================
  // おと
  // ============================================================
  var AudioCtx = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  var soundOn = load("sound", "1") === "1";
  var soundBtn = $("sound");

  function paintSoundButton() { soundBtn.innerHTML = soundOn ? "🔊" : "🔇"; }

  function audio() {
    if (!AudioCtx) return null;
    if (!actx) { try { actx = new AudioCtx(); } catch (e) { actx = null; } }
    // iOS は画面を触ったあとでないと音が出ないので、その都度起こす
    if (actx && actx.state === "suspended" && actx.resume) {
      try { actx.resume(); } catch (e) {}
    }
    return actx;
  }

  // freqs を順番に鳴らす。鳴らせない環境では黙って何もしない
  function play(freqs, dur, type, gain) {
    if (!soundOn) return;
    var ctx = audio();
    if (!ctx) return;
    try {
      var t0 = ctx.currentTime;
      for (var i = 0; i < freqs.length; i++) {
        var osc = ctx.createOscillator();
        var amp = ctx.createGain();
        osc.type = type || "sine";
        osc.frequency.value = freqs[i];
        var at = t0 + i * dur;
        amp.gain.setValueAtTime(0.0001, at);
        amp.gain.linearRampToValueAtTime(gain || 0.16, at + 0.012);
        amp.gain.exponentialRampToValueAtTime(0.0001, at + dur);
        osc.connect(amp);
        amp.connect(ctx.destination);
        if (osc.start) { osc.start(at); osc.stop(at + dur + 0.02); }
        else if (osc.noteOn) { osc.noteOn(at); osc.noteOff(at + dur + 0.02); }
      }
    } catch (e) {}
  }

  function soundHit()   { play([740, 520], 0.09, "sine", 0.2); }
  function soundGold()  { play([784, 988, 1319], 0.1, "sine", 0.2); }
  function soundFlip()  { play([420], 0.05, "triangle", 0.1); }
  function soundMatch() { play([880, 1175], 0.11, "sine", 0.18); }
  function soundClear() { play([523, 659, 784, 1047], 0.15, "sine", 0.2); }

  onTap(soundBtn, function () {
    soundOn = !soundOn;
    save("sound", soundOn ? "1" : "0");
    paintSoundButton();
    if (soundOn) soundMatch();
  });
  paintSoundButton();

  // ============================================================
  // ごほうび (紙ふぶき / ほめことば / はなまる)
  // ============================================================
  var PRAISE = ["じょうず！", "すごい！", "やったね！", "おみごと！", "はなまる！"];
  function praise() { return PRAISE[Math.floor(Math.random() * PRAISE.length)]; }

  var confBox = $("confetti"), confTimer = null;

  function confetti() {
    var chars = ["🌸", "🎉", "💮", "⭐", "🎊", "🍀"];
    var height = (window.innerHeight || 800) + 80;
    var items = [];

    confBox.innerHTML = "";
    for (var i = 0; i < 26; i++) {
      var s = document.createElement("span");
      s.innerHTML = chars[Math.floor(Math.random() * chars.length)];
      s.style.left = Math.floor(Math.random() * 92) + "%";
      s.style.fontSize = (22 + Math.floor(Math.random() * 20)) + "px";
      var y = -40 - Math.floor(Math.random() * 260);
      s.style.top = y + "px";
      confBox.appendChild(s);
      items.push({ el: s, y: y, v: 13 + Math.random() * 13 });
    }

    if (confTimer !== null) clearInterval(confTimer);
    confTimer = setInterval(function () {
      var alive = 0;
      for (var k = 0; k < items.length; k++) {
        if (items[k].y > height) continue;
        items[k].y += items[k].v;
        items[k].el.style.top = items[k].y + "px";
        alive++;
      }
      if (!alive) {
        clearInterval(confTimer);
        confTimer = null;
        confBox.innerHTML = "";
      }
    }, 33);
  }

  var stampsEl = $("stamps");
  var stamps = Number(load("clears", "0")) || 0;

  function paintStamps() {
    if (stamps <= 0) {
      stampsEl.innerHTML = "クリアすると はなまるが たまります";
      return;
    }
    var shown = stamps > 10 ? 10 : stamps;
    var marks = "";
    for (var i = 0; i < shown; i++) marks += "💮";
    stampsEl.innerHTML = '<span class="marks">' + marks + "</span>　" + stamps + "かい クリア";
  }

  function celebrate(el, text) {
    stamps++;
    save("clears", stamps);
    paintStamps();
    el.innerHTML = text + " " + praise();
    confetti();
    soundClear();
  }

  paintStamps();

  // ============================================================
  // もぐらたたき
  // ============================================================
  var MO_COLS = 3, MO_ROWS = 2, MO_GOAL = 10;
  var MO_SPEEDS = [
    { key: "slow", label: "ゆっくり", up: 2800, gap: 900 },
    { key: "normal", label: "ふつう", up: 1900, gap: 600 }
  ];

  var moBoard = $("mogura-board"), moBody = $("mogura-body");
  var moScoreEl = $("mogura-score"), moMsgEl = $("mogura-msg"), moSpeedsEl = $("mogura-speeds");
  var moHoles = [], moScore = 0, moCurrent = -1, moLast = -1, moGold = false;
  var moUpTimer = null, moNextTimer = null, moPopTimer = null, moRunning = false;
  var moSpeed = MO_SPEEDS[0];

  (function restoreSpeed() {
    var key = load("speed", "slow");
    for (var i = 0; i < MO_SPEEDS.length; i++) if (MO_SPEEDS[i].key === key) moSpeed = MO_SPEEDS[i];
  })();

  function moBuildSpeedButtons() {
    for (var i = 0; i < MO_SPEEDS.length; i++) {
      (function (cfg) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "big" + (cfg === moSpeed ? " on" : "");
        b.innerHTML = cfg.label;
        b.setAttribute("data-speed", cfg.key);
        onTap(b, function () {
          moSpeed = cfg;
          save("speed", cfg.key);
          var bs = moSpeedsEl.getElementsByTagName("button");
          for (var k = 0; k < bs.length; k++) {
            bs[k].className = "big" + (bs[k].getAttribute("data-speed") === cfg.key ? " on" : "");
          }
          moStart();
        });
        moSpeedsEl.appendChild(b);
      })(MO_SPEEDS[i]);
    }
  }

  function moBuild() {
    while (moBody.firstChild) moBody.removeChild(moBody.firstChild);
    moHoles = [];
    for (var r = 0; r < MO_ROWS; r++) {
      var tr = document.createElement("tr");
      for (var c = 0; c < MO_COLS; c++) {
        var td = document.createElement("td");
        td.className = "hole";
        td.innerHTML = '<span class="mole">🐹</span><span class="pop">＋1</span>';
        (function (el) { onTap(el, function () { moHit(el); }); })(td);
        moHoles.push(td);
        tr.appendChild(td);
      }
      moBody.appendChild(tr);
    }
    moResize();
  }

  function moResize() {
    if (!moHoles.length) return;
    var s = fitSize(MO_COLS, 140, 10);
    moBoard.style.width = (MO_COLS * s + (MO_COLS + 1) * 10) + "px";
    for (var i = 0; i < moHoles.length; i++) {
      moHoles[i].style.height = s + "px";
      moHoles[i].style.fontSize = Math.round(s * 0.5) + "px";
      moHoles[i].getElementsByTagName("span")[1].style.fontSize = Math.round(s * 0.2) + "px";
    }
  }

  function moClearTimers() {
    if (moUpTimer !== null) { clearTimeout(moUpTimer); moUpTimer = null; }
    if (moNextTimer !== null) { clearTimeout(moNextTimer); moNextTimer = null; }
  }

  function moHideCurrent() {
    if (moCurrent >= 0) {
      moHoles[moCurrent].className = "hole";
      moHoles[moCurrent].getElementsByTagName("span")[0].innerHTML = "🐹";
      moCurrent = -1;
    }
    moGold = false;
  }

  function moSpawn() {
    if (!moRunning) return;
    var i;
    do { i = Math.floor(Math.random() * moHoles.length); }
    while (moHoles.length > 1 && i === moLast);
    moLast = i;
    moCurrent = i;

    // 4回に1回くらい きんのもぐら。ただし あと1ぴきの時は ふつうのもぐら
    moGold = (MO_GOAL - moScore) > 2 && Math.random() < 0.25;

    var hole = moHoles[i];
    hole.getElementsByTagName("span")[0].innerHTML = moGold ? "✨🐹" : "🐹";
    hole.getElementsByTagName("span")[1].innerHTML = moGold ? "＋3" : "＋1";
    hole.className = moGold ? "hole up gold" : "hole up";

    // たたかなくても しばらくすると ひっこむ (失敗にはならない)
    moUpTimer = setTimeout(function () {
      moHideCurrent();
      moNextTimer = setTimeout(moSpawn, moSpeed.gap);
    }, moSpeed.up);
  }

  function moHit(el) {
    if (!moRunning) return;
    if (moCurrent < 0 || moHoles[moCurrent] !== el) return;   // 空の穴は なにも起きない

    moClearTimers();
    var gained = moGold ? 3 : 1;
    moScore += gained;
    if (moScore > MO_GOAL) moScore = MO_GOAL;
    moScoreEl.innerHTML = String(moScore);

    if (moGold) soundGold(); else soundHit();

    el.className = "hole hit";
    el.getElementsByTagName("span")[0].innerHTML = "🐹";
    if (moPopTimer !== null) clearTimeout(moPopTimer);
    (function (hole) {
      moPopTimer = setTimeout(function () { hole.className = "hole"; }, 450);
    })(el);
    moCurrent = -1;
    moGold = false;

    if (moScore >= MO_GOAL) {
      moRunning = false;
      celebrate(moMsgEl, "ぜんぶ たたけました！");
      return;
    }
    moNextTimer = setTimeout(moSpawn, moSpeed.gap);
  }

  function moStart() {
    moStop();
    moScore = 0;
    moLast = -1;
    moScoreEl.innerHTML = "0";
    moMsgEl.innerHTML = "";
    for (var i = 0; i < moHoles.length; i++) {
      moHoles[i].className = "hole";
      moHoles[i].getElementsByTagName("span")[0].innerHTML = "🐹";
    }
    moRunning = true;
    moNextTimer = setTimeout(moSpawn, moSpeed.gap);
  }

  function moStop() {
    moRunning = false;
    moClearTimers();
    if (moPopTimer !== null) { clearTimeout(moPopTimer); moPopTimer = null; }
    moHideCurrent();
  }

  onTap($("mogura-reset"), moStart);

  // ============================================================
  // しんけいすいじゃく
  // ============================================================
  var MEM_THEMES = [
    { key: "hana", label: "🌸", faces: ["🌸", "🌻", "🌷", "🌹", "🍀", "🌼"] },
    { key: "animal", label: "🐱", faces: ["🐱", "🐶", "🐰", "🐼", "🐤", "🐸"] },
    { key: "fruit", label: "🍎", faces: ["🍎", "🍓", "🍇", "🍊", "🍑", "🍉"] }
  ];
  var MEM_SIZES = [
    { cards: 4,  cols: 2, label: "4まい" },
    { cards: 8,  cols: 4, label: "8まい" },
    { cards: 12, cols: 4, label: "12まい" }
  ];

  var meBoard = $("memory-board"), meBody = $("memory-body");
  var meScoreEl = $("memory-score"), meMsgEl = $("memory-msg");
  var meSizesEl = $("memory-sizes"), meThemesEl = $("memory-themes");
  var meCells = [], meFaces = [], meDone = [], meOpen = [];
  var meFlips = 0, meBusy = false, meBackTimer = null;
  var meSize = MEM_SIZES[1], meTheme = MEM_THEMES[0], meCols = 4;

  (function restoreMemory() {
    var cards = Number(load("cards", "8"));
    for (var i = 0; i < MEM_SIZES.length; i++) if (MEM_SIZES[i].cards === cards) meSize = MEM_SIZES[i];
    var theme = load("theme", "hana");
    for (var j = 0; j < MEM_THEMES.length; j++) if (MEM_THEMES[j].key === theme) meTheme = MEM_THEMES[j];
  })();

  function meBuildButtons() {
    for (var i = 0; i < MEM_SIZES.length; i++) {
      (function (cfg) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "big" + (cfg === meSize ? " on" : "");
        b.innerHTML = cfg.label;
        b.setAttribute("data-cards", cfg.cards);
        onTap(b, function () {
          meSize = cfg;
          save("cards", cfg.cards);
          var bs = meSizesEl.getElementsByTagName("button");
          for (var k = 0; k < bs.length; k++) {
            bs[k].className = "big" + (Number(bs[k].getAttribute("data-cards")) === cfg.cards ? " on" : "");
          }
          meStart();
        });
        meSizesEl.appendChild(b);
      })(MEM_SIZES[i]);
    }

    for (var t = 0; t < MEM_THEMES.length; t++) {
      (function (cfg) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "big icon" + (cfg === meTheme ? " on" : "");
        b.innerHTML = cfg.label;
        b.setAttribute("data-theme", cfg.key);
        onTap(b, function () {
          meTheme = cfg;
          save("theme", cfg.key);
          var bs = meThemesEl.getElementsByTagName("button");
          for (var k = 0; k < bs.length; k++) {
            bs[k].className = "big icon" + (bs[k].getAttribute("data-theme") === cfg.key ? " on" : "");
          }
          meStart();
        });
        meThemesEl.appendChild(b);
      })(MEM_THEMES[t]);
    }
  }

  function meStart() {
    if (meBackTimer !== null) { clearTimeout(meBackTimer); meBackTimer = null; }
    meBusy = false;
    meFlips = 0;
    meOpen = [];
    meScoreEl.innerHTML = "0";
    meMsgEl.innerHTML = "";

    var pairs = meSize.cards / 2;
    meCols = meSize.cols;

    meFaces = [];
    for (var p = 0; p < pairs; p++) {
      meFaces.push(meTheme.faces[p]);
      meFaces.push(meTheme.faces[p]);
    }
    for (var i = meFaces.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = meFaces[i]; meFaces[i] = meFaces[j]; meFaces[j] = tmp;
    }

    meDone = [];
    for (var d = 0; d < meFaces.length; d++) meDone.push(false);

    while (meBody.firstChild) meBody.removeChild(meBody.firstChild);
    meCells = [];
    var rows = Math.ceil(meFaces.length / meCols);
    for (var r = 0; r < rows; r++) {
      var tr = document.createElement("tr");
      for (var c = 0; c < meCols; c++) {
        var idx = r * meCols + c;
        if (idx >= meFaces.length) break;
        var td = document.createElement("td");
        td.className = "card";
        td.innerHTML = '<span class="face">' + meFaces[idx] + "</span>";
        (function (i2) { onTap(td, function () { meFlip(i2); }); })(idx);
        meCells.push(td);
        tr.appendChild(td);
      }
      meBody.appendChild(tr);
    }
    meResize();
  }

  function meResize() {
    if (!meCells.length) return;
    var s = fitSize(meCols, 130, 10);
    meBoard.style.width = (meCols * s + (meCols + 1) * 10) + "px";
    for (var i = 0; i < meCells.length; i++) {
      meCells[i].style.height = s + "px";
      meCells[i].style.fontSize = Math.round(s * 0.52) + "px";
    }
  }

  function meFlip(i) {
    if (meBusy) return;
    if (meDone[i]) return;
    if (meOpen.length && meOpen[0] === i) return;   // 同じカードの 2度めくりは無効

    meCells[i].className = "card open";
    soundFlip();
    meFlips++;
    meScoreEl.innerHTML = String(meFlips);
    meOpen.push(i);

    if (meOpen.length < 2) return;

    var a = meOpen[0], b = meOpen[1];
    if (meFaces[a] === meFaces[b]) {
      meDone[a] = true;
      meDone[b] = true;
      meCells[a].className = "card done";
      meCells[b].className = "card done";
      meOpen = [];
      soundMatch();

      for (var k = 0; k < meDone.length; k++) {
        if (!meDone[k]) { meMsgEl.innerHTML = "そろった！"; return; }
      }
      celebrate(meMsgEl, "ぜんぶ そろいました！");
    } else {
      meBusy = true;
      meBackTimer = setTimeout(function () {
        meCells[a].className = "card";
        meCells[b].className = "card";
        meOpen = [];
        meBusy = false;
        meBackTimer = null;
      }, 1200);
    }
  }

  onTap($("memory-reset"), meStart);

  // ============================================================
  // タブの切り替え
  // ============================================================
  var tabMo = $("tab-mogura"), tabMe = $("tab-memory");
  var paneMo = $("game-mogura"), paneMe = $("game-memory");

  function showMogura() {
    tabMo.className = "tab active";
    tabMe.className = "tab";
    paneMo.style.display = "";
    paneMe.style.display = "none";
    moStart();
  }

  function showMemory() {
    tabMe.className = "tab active";
    tabMo.className = "tab";
    paneMe.style.display = "";
    paneMo.style.display = "none";
    moStop();          // 裏でもぐらが動き続けないように止める
    meStart();
  }

  onTap(tabMo, showMogura);
  onTap(tabMe, showMemory);

  window.onresize = function () { moResize(); meResize(); };

  // ---- 起動 ----
  moBuildSpeedButtons();
  moBuild();
  meBuildButtons();
  meStart();
  moStart();

  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.onload = function () {
      navigator.serviceWorker.register("sw.js")["catch"](function () {});
    };
  }
})();
</script>
</body>
</html>
