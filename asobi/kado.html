<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ねこさがし (しさく)</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  /* ねこさがし の しさく。マインスイーパーと おなじ しくみで、
     かずは マスの 「かど」 に でる。かどの かずは その かどに ふれて いる 4マス (へりは 2マス) だけを かぞえる。
     古い iPad 用に Flexbox / Grid / 矢印関数 などは つかわない */
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; padding: 0; background: #f6efdd; }
  body {
    text-align: center; color: #2f2a24; padding: 6px 12px 40px;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
  }
  h1 { font-size: 26px; margin: 4px 0 2px; }
  .rule { font-size: 17px; line-height: 26px; margin: 0 auto 6px; max-width: 640px; color: #6d6355; }
  .rule b { color: #e07a2f; }
  .score { font-size: 22px; font-weight: 700; margin: 2px 0 6px; white-space: nowrap; overflow: hidden; }
  .score b { color: #e07a2f; font-size: 26px; }
  .msg { font-size: 20px; font-weight: 700; min-height: 30px; line-height: 30px; margin: 6px 0; color: #3f8f4f; }
  .msg.bad { color: #c0392b; }
  button.big {
    -webkit-appearance: none; appearance: none; font: inherit; font-size: 20px; font-weight: 700;
    padding: 10px 18px; margin: 4px; border-radius: 14px; border: 2px solid #d9cdb2;
    background: #fff; color: #2f2a24; min-width: 110px;
  }
  button.big.on { background: #e07a2f; border-color: #e07a2f; color: #fff; }
  .ctrl { margin: 6px 0; }
  .label { display: inline-block; font-size: 16px; color: #6d6355; margin-right: 6px; }

  #board { position: relative; margin: 0 auto; touch-action: none; }
  .c {
    position: absolute; border-radius: 10px;
    background: #7cc36a; border: 2px solid #5fa64f;
    box-shadow: inset 0 -5px 0 rgba(0, 0, 0, .12);
    text-align: center;
  }
  .c i { font-style: normal; display: block; }
  .c.open { background: #f3e3c3; border-color: #e2cfa6; box-shadow: none; }
  .c.cat { background: #ffd9d0; border-color: #f0a898; box-shadow: none; }
  /* すうじに さわった とき。くさむらは みどりの まま ふちを ひからせ、ひらいた マスは きいろく */
  .c.lit { border-color: #ff8c1a; box-shadow: 0 0 0 4px #ffb347; }
  .c.lit.open { background: #fff0b8; }
  .c.lit.cat { background: #ffd9d0; }
  .c.hint {
    -webkit-animation: kdhint .8s ease-in-out 4 alternate;
    animation: kdhint .8s ease-in-out 4 alternate;
  }
  @-webkit-keyframes kdhint { from { -webkit-transform: scale(1); } to { -webkit-transform: scale(.86); } }
  @keyframes kdhint { from { transform: scale(1); } to { transform: scale(.86); } }
  .c.pop {
    -webkit-animation: kdpop .35s ease-out;
    animation: kdpop .35s ease-out;
  }
  @-webkit-keyframes kdpop { 0% { -webkit-transform: scale(.6); } 70% { -webkit-transform: scale(1.08); } 100% { -webkit-transform: scale(1); } }
  @keyframes kdpop { 0% { transform: scale(.6); } 70% { transform: scale(1.08); } 100% { transform: scale(1); } }

  /* かどの かず。まるい ふだが かどの 上に のる */
  .v {
    position: absolute; border-radius: 50%; background: #fff; border: 3px solid #e07a2f;
    color: #2f2a24; font-weight: 700; text-align: center; z-index: 2;
    box-shadow: 0 2px 3px rgba(0, 0, 0, .18);
  }
  .v.z { border-color: #d9cdb2; color: #b5a888; }
  .v.done { border-color: #cfc6b2; color: #a89f8c; background: #f4f0e6; box-shadow: none; }
  .v.lit { border-color: #ff9f1a; background: #fff3c4; color: #2f2a24; }
  .v svg g { fill: #7a4a2a; }
  .v.done svg g { fill: #c4b9a3; }
  .v .pw { line-height: 0; }
  .v .pw div { line-height: 0; white-space: nowrap; }
  /* ルールの 絵。ねこ 1ぴき と、となりあう 2ひき */
  .demo { margin: 4px 0 2px; }
  .mini { display: inline-block; position: relative; margin: 0 14px; vertical-align: top; }
  .mini .c { border-radius: 6px; }
  .mini .c.cat { font-size: 28px; line-height: 40px; }
  .mini .v { border-width: 2px; }
  /* よこむき: せつめいは ひだり、ばんは みぎ。Flexbox を つかわず table-cell で ならべる */
  #wide { display: none; width: 100%; }
  body.wide #wide { display: table; table-layout: fixed; }
  #lcol, #rcol { display: table-cell; vertical-align: top; }
  #lcol { width: 400px; padding-right: 8px; }
  body.wide .rule { font-size: 16px; line-height: 23px; }
  body.wide #main { padding-top: 4px; }
  body.wide button.big { padding: 10px 12px; min-width: 0; margin: 4px 3px; }
</style>
</head>
<body>
<div id="top">
<h1>🐱 ねこさがし <small style="font-size:14px;color:#a89f8c">しさく</small></h1>
<p class="rule">くさむらに ねこが かくれて います。<br>ねこの いる マスの <b>4つの かど</b> には、<b>あしあと</b> が 1つずつ つきます。</p>
<div class="demo"><div class="mini" id="demo1"></div><div class="mini" id="demo2"></div></div>
<p class="rule" style="margin-top:0">あしあとを 見て ねこの いばしょを あてましょう。ねこの いない マスを ぜんぶ ひらいたら できあがり。</p>
</div>
<div id="main">
<p class="score">❤️ <b id="hearts">3</b>　🐱 のこり <b id="cats">0</b>　⏱ <b id="time">0</b> びょう</p>
<div id="board"></div>
<p class="msg" id="msg">どこか 1つ さわって はじめましょう</p>
</div>
<div id="bot">
<div class="ctrl">
  <button type="button" class="big on" id="m-open">👆 ひらく</button>
  <button type="button" class="big" id="m-mark">🐈 めじるし</button>
  <button type="button" class="big" id="hint">💡 ヒント</button>
</div>
<div class="ctrl"><button type="button" class="big" id="reset">もういちど</button></div>
<div class="ctrl"><span class="label">おおきさ</span><span id="levels"></span></div>
<p class="rule" style="font-size:15px">あしあとに さわると、その かどに ふれて いる マスが ひかります。<br>ながおし でも 🐈 めじるし が おけます。<br>あしあとの ない かどの まわりは、かってに ひらきます。<br>かならず すいりで とける ばん だけが でます。</p>
</div>
<div id="wide"><div id="lcol"></div><div id="rcol"></div></div>

<script>
(function () {
  "use strict";
  var LEVELS = [
    // ねこが すくないと 0 の かどばかりに なり、さいしょの 1かいで ほとんど ひらいて しまう。3わりくらい いれる
    { key: "s", label: "5 × 5", w: 5, h: 5, n: 7 },
    { key: "m", label: "6 × 6", w: 6, h: 6, n: 11 },
    { key: "l", label: "8 × 8", w: 8, h: 8, n: 20 }
  ];
  function $(id) { return document.getElementById(id); }
  function load(k, d) { try { var v = localStorage.getItem("asobi-kd-" + k); return v === null ? d : v; } catch (e) { return d; } }
  function save(k, v) { try { localStorage.setItem("asobi-kd-" + k, String(v)); } catch (e) {} }

  // ---- おと ----
  var actx = null;
  function play(freqs, dur, gain) {
    try {
      if (!actx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return; actx = new A(); }
      var t0 = actx.currentTime;
      for (var i = 0; i < freqs.length; i++) {
        var o = actx.createOscillator(), g = actx.createGain();
        o.type = "sine"; o.frequency.value = freqs[i];
        g.gain.setValueAtTime(gain, t0 + i * dur);
        g.gain.exponentialRampToValueAtTime(0.001, t0 + (i + 1) * dur + 0.05);
        o.connect(g); g.connect(actx.destination);
        o.start(t0 + i * dur); o.stop(t0 + (i + 1) * dur + 0.06);
      }
    } catch (e) {}
  }

  var lv = LEVELS[0];
  (function () { var k = load("level", "s"); for (var i = 0; i < LEVELS.length; i++) if (LEVELS[i].key === k) lv = LEVELS[i]; })();
  var W, H, N, cat, st, vis, clue, cells, vels, started, alive, hearts, mode = "open";
  var timer = null, t0 = 0, sec = 0;
  var boardEl = $("board"), msgEl = $("msg");
  var cs = 60;   // マスの 大きさ

  // ---- かどと マスの つながり ----
  function vCells(v) {            // かど v に ふれる マス
    var vr = Math.floor(v / (W + 1)), vc = v % (W + 1), out = [];
    for (var dr = -1; dr <= 0; dr++) for (var dc = -1; dc <= 0; dc++) {
      var r = vr + dr, c = vc + dc;
      if (r >= 0 && r < H && c >= 0 && c < W) out.push(r * W + c);
    }
    return out;
  }
  function cVerts(i) {            // マス i の 4つの かど (そとの すみは のぞく。1マス しか ふれず 意味が ない)
    var r = Math.floor(i / W), c = i % W, out = [], k, vr, vc;
    var cand = [[r, c], [r, c + 1], [r + 1, c], [r + 1, c + 1]];
    for (k = 0; k < 4; k++) {
      vr = cand[k][0]; vc = cand[k][1];
      if ((vr === 0 || vr === H) && (vc === 0 || vc === W)) continue;
      out.push(vr * (W + 1) + vc);
    }
    return out;
  }

  // ---- すいり (ばんが すいりで とけるか / ヒント) ----
  // know[i]: 0 わからない / 1 ねこ なし / 2 ねこ。 shown[v] の かどの かずだけ つかう
  function deduce(know, shown, cl) {
    var cons = [], v, k, j, i, a, b, changed = true, found = false;
    function build() {
      cons = [];
      for (v = 0; v < shown.length; v++) {
        if (!shown[v]) continue;
        var cc = vCells(v), u = [], need = cl[v];
        for (k = 0; k < cc.length; k++) { if (know[cc[k]] === 0) u.push(cc[k]); else if (know[cc[k]] === 2) need--; }
        if (u.length) cons.push({ u: u, n: need });
      }
    }
    function set(list, val) { for (var q = 0; q < list.length; q++) if (know[list[q]] === 0) { know[list[q]] = val; changed = true; found = true; } }
    while (changed) {
      changed = false;
      build();
      for (i = 0; i < cons.length; i++) {
        if (cons[i].n === 0) set(cons[i].u, 1);
        else if (cons[i].n === cons[i].u.length) set(cons[i].u, 2);
      }
      if (changed) continue;
      // ふくまれる くみあわせ: A が B に ふくまれるなら、B の のこりに B.n - A.n
      for (i = 0; i < cons.length && !changed; i++) for (j = 0; j < cons.length && !changed; j++) {
        if (i === j) continue;
        a = cons[i]; b = cons[j];
        if (a.u.length >= b.u.length) continue;
        var rest = [], inside = true;
        for (k = 0; k < a.u.length; k++) if (b.u.indexOf(a.u[k]) < 0) { inside = false; break; }
        if (!inside) continue;
        for (k = 0; k < b.u.length; k++) if (a.u.indexOf(b.u[k]) < 0) rest.push(b.u[k]);
        var d = b.n - a.n;
        if (d === 0) set(rest, 1); else if (d === rest.length) set(rest, 2);
      }
    }
    return found;
  }

  // ひらいて 0 なら まわりも ひらく (シミュレーション と ほんばん で つかう)
  function spread(i, know, shown, cl, onOpen) {
    var stack = [i];
    while (stack.length) {
      var x = stack.pop();
      if (know[x] === 1 && onOpen && onOpen.done[x]) continue;
      know[x] = 1;
      if (onOpen) { if (onOpen.done[x]) continue; onOpen.done[x] = 1; onOpen.f(x); }
      var vs = cVerts(x);
      for (var k = 0; k < vs.length; k++) {
        var v = vs[k];
        if (shown[v]) continue;
        shown[v] = 1;
        if (cl[v] === 0) { var cc = vCells(v); for (var q = 0; q < cc.length; q++) if (!onOpen || !onOpen.done[cc[q]]) stack.push(cc[q]); }
      }
    }
  }

  function solvable(c, first) {
    var cl = clues(c), know = [], shown = [], i, done = {};
    for (i = 0; i < W * H; i++) know.push(0);
    for (i = 0; i < (W + 1) * (H + 1); i++) shown.push(0);
    var opener = { done: done, f: function () {} };
    spread(first, know, shown, cl, opener);
    for (var guard = 0; guard < 200; guard++) {
      deduce(know, shown, cl);
      var opened = false;
      for (i = 0; i < W * H; i++) if (know[i] === 1 && !done[i]) { spread(i, know, shown, cl, opener); opened = true; }
      if (!opened) break;
    }
    for (i = 0; i < W * H; i++) if (!c[i] && !done[i]) return false;
    return true;
  }

  function clues(c) {
    var out = [];
    for (var v = 0; v < (W + 1) * (H + 1); v++) {
      var cc = vCells(v), n = 0;
      for (var k = 0; k < cc.length; k++) if (c[cc[k]]) n++;
      out.push(n);
    }
    return out;
  }

  // さいしょに さわった マスと その まわりには ねこを おかない。すいりで とける ばんが でるまで つくりなおす
  function makeBoard(first) {
    var fr = Math.floor(first / W), fc = first % W, tries, i;
    for (tries = 0; tries < 400; tries++) {
      var free = [], c = [];
      for (i = 0; i < W * H; i++) {
        c.push(false);
        var r = Math.floor(i / W), cc = i % W;
        if (Math.abs(r - fr) > 1 || Math.abs(cc - fc) > 1) free.push(i);
      }
      for (i = free.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = free[i]; free[i] = free[j]; free[j] = t; }
      for (i = 0; i < N && i < free.length; i++) c[free[i]] = true;
      if (solvable(c, first)) return c;
    }
    return c;   // まず こない。きても あそべる (ヒントで すすめる)
  }

  // ---- がめん ----
  // よこむきで ひろい 画面は 2れつに する。ばしょを うごかす だけで なかみは おなじ
  var isWide = false;
  function arrange(vw, vh) {
    var w = vw > vh && vw >= 760;
    if (w === isWide) return;
    isWide = w;
    var body = document.body, wide = $("wide");
    if (w) {
      $("lcol").appendChild($("top")); $("lcol").appendChild($("bot")); $("rcol").appendChild($("main"));
      body.className = "wide";
    } else {
      body.insertBefore($("top"), wide); body.insertBefore($("main"), wide); body.insertBefore($("bot"), wide);
      body.className = "";
    }
  }
  function layout() {
    var vw = window.innerWidth || document.documentElement.clientWidth || 768;
    var vh = window.innerHeight || document.documentElement.clientHeight || 1024;
    arrange(vw, vh);
    var top = boardEl.getBoundingClientRect().top + (window.pageYOffset || 0);
    var room = isWide ? $("rcol").offsetWidth - 16 : Math.min(vw - 24, 680);
    var byW = Math.floor(room / W);
    var byH = Math.floor((vh - top - (isWide ? 60 : 190)) / H);
    cs = Math.max(34, Math.min(byW, byH, 96));
    var gap = Math.max(3, Math.round(cs * 0.06));
    boardEl.style.width = (W * cs) + "px";
    boardEl.style.height = (H * cs) + "px";
    var i, v, el;
    for (i = 0; i < cells.length; i++) {
      el = cells[i];
      el.style.left = ((i % W) * cs + gap / 2) + "px";
      el.style.top = (Math.floor(i / W) * cs + gap / 2) + "px";
      el.style.width = (cs - gap) + "px";
      el.style.height = (cs - gap) + "px";
      el.style.lineHeight = (cs - gap - 4) + "px";
      el.style.fontSize = Math.round(cs * 0.5) + "px";
    }
    var d = Math.round(cs * 0.46);
    vd = d;
    boardEl.style.margin = Math.round(d / 2 + 4) + "px auto";   // へりの ふだが そとに はみでる ぶん
    for (v = 0; v < vels.length; v++) {
      el = vels[v];
      if (!el) continue;
      el.style.width = d + "px"; el.style.height = d + "px";
      el.style.left = ((v % (W + 1)) * cs - d / 2) + "px";
      el.style.top = (Math.floor(v / (W + 1)) * cs - d / 2) + "px";
      el.style.lineHeight = (d - 6) + "px";
      el.style.fontSize = Math.round(d * 0.62) + "px";
    }
  }

  function build() {
    W = lv.w; H = lv.h; N = lv.n;
    while (boardEl.firstChild) boardEl.removeChild(boardEl.firstChild);
    cells = []; vels = []; cat = []; st = []; vis = [];
    var i;
    for (i = 0; i < W * H; i++) {
      var el = document.createElement("div");
      el.className = "c"; el.setAttribute("data-c", String(i));
      el.appendChild(document.createElement("i"));
      boardEl.appendChild(el); cells.push(el);
      cat.push(false); st.push(0);
    }
    for (i = 0; i < (W + 1) * (H + 1); i++) {
      vis.push(0);
      var vr = Math.floor(i / (W + 1)), vc = i % (W + 1);
      if ((vr === 0 || vr === H) && (vc === 0 || vc === W)) { vels.push(null); continue; }
      var ve = document.createElement("div");
      ve.className = "v"; ve.setAttribute("data-v", String(i)); ve.style.display = "none";
      boardEl.appendChild(ve); vels.push(ve);
    }
    clue = [];
    started = false; alive = true; hearts = 3;
    stopClock(); sec = 0; $("time").innerHTML = "0";
    msgEl.className = "msg"; msgEl.innerHTML = "どこか 1つ さわって はじめましょう";
    layout(); paintAll(); paintScore();
  }

  function paintCell(i) {
    var el = cells[i], s = st[i], ic = el.firstChild;
    if (s === 1) { el.className = "c open"; ic.innerHTML = ""; }
    else if (s === 3) { el.className = "c cat"; ic.innerHTML = "🐱"; }
    else if (s === 2) { el.className = "c"; ic.innerHTML = "🐈"; }
    else { el.className = "c"; ic.innerHTML = (!alive && cat[i]) ? "😺" : ""; }
  }
  // あしあとの え。n こ を 2れつ までで ならべる
  function paw(p) {
    return '<svg width="' + p + '" height="' + p + '" viewBox="0 0 20 20" style="display:inline-block;vertical-align:top"><g fill="#7a4a2a">' +
      '<ellipse cx="10" cy="13.6" rx="5.3" ry="4.5"/><circle cx="3.7" cy="8.3" r="2.4"/><circle cx="7.6" cy="4.2" r="2.5"/>' +
      '<circle cx="12.4" cy="4.2" r="2.5"/><circle cx="16.3" cy="8.3" r="2.4"/></g></svg>';
  }
  // あしあとの ふだ。1つは まる、2つは よこながの まる、3つ 4つは 大きい まるに 2だん
  function pawBox(n, d) {
    var w, h, p, rows;
    if (n === 1) { w = h = d; p = Math.floor(d * 0.62); rows = [1]; }
    else if (n === 2) { h = d; w = Math.round(d * 1.7); p = Math.floor(d * 0.6); rows = [2]; }
    else { w = h = Math.round(d * 1.4); p = Math.floor(d * 0.5); rows = [2, n - 2]; }
    var top = Math.floor((h - 6 - rows.length * p) / 2), out = '<div class="pw" style="padding-top:' + top + 'px">', k, q;
    for (k = 0; k < rows.length; k++) { out += "<div>"; for (q = 0; q < rows[k]; q++) out += paw(p); out += "</div>"; }
    return { w: w, h: h, html: out + "</div>" };
  }
  var vd = 30;
  function paintV(v) {
    var el = vels[v];
    if (!el) return;
    if (!vis[v] || clue[v] === 0) { el.style.display = "none"; return; }   // 0 は まわりが ぜんぶ ひらくので だす いみが ない
    el.style.display = "";
    var b = pawBox(clue[v], vd);   // ちいさい 画面でも すうじには しない (あしあとの お話が くずれる)
    el.innerHTML = b.html;
    el.style.width = b.w + "px"; el.style.height = b.h + "px";
    el.style.left = ((v % (W + 1)) * cs - b.w / 2) + "px";
    el.style.top = (Math.floor(v / (W + 1)) * cs - b.h / 2) + "px";
    var cc = vCells(v), open = true;
    for (var k = 0; k < cc.length; k++) if (st[cc[k]] === 0) { open = false; break; }
    el.className = "v" + (clue[v] === 0 ? " z" : open ? " done" : "");
  }
  function paintAll() {
    for (var i = 0; i < cells.length; i++) paintCell(i);
    for (var v = 0; v < vels.length; v++) paintV(v);
  }
  function paintScore() {
    var marked = 0, i;
    for (i = 0; i < st.length; i++) if (st[i] === 2 || st[i] === 3) marked++;
    $("hearts").innerHTML = String(hearts);
    $("cats").innerHTML = String(Math.max(0, N - marked));
  }

  function startClock() {
    stopClock(); t0 = new Date().getTime();
    timer = setInterval(function () { var s = Math.min(999, Math.floor((new Date().getTime() - t0) / 1000)); if (s !== sec) { sec = s; $("time").innerHTML = String(s); } }, 250);
  }
  function stopClock() { if (timer !== null) { clearInterval(timer); timer = null; } }

  // ---- あそぶ ----
  function openCell(i) {
    if (!alive || st[i] === 1 || st[i] === 3) return;
    if (st[i] === 2) { msgEl.className = "msg"; msgEl.innerHTML = "🐈 を とってから ひらいてね (もう いちど 🐈 で とれます)"; return; }
    if (!started) {
      cat = makeBoard(i); clue = clues(cat); started = true; startClock();
    }
    if (cat[i]) {
      st[i] = 3; hearts--;
      paintCell(i); cells[i].className += " pop";
      play([330, 262], 0.14, 0.15);
      paintScore(); paintAround(i);
      if (hearts <= 0) { lose(); return; }
      msgEl.className = "msg bad"; msgEl.innerHTML = "にゃっ！ ねこが いました。かどに あしあとが ついて いたね";
      flashCorners(i);
      return;
    }
    var know = [], k;
    for (k = 0; k < st.length; k++) know.push(st[k] === 1 ? 1 : 0);
    var count = 0;
    spread(i, know, vis, clue, { done: {}, f: function (x) {
      if (st[x] === 1) return;
      st[x] = 1; count++;
      paintCell(x);
      cells[x].className += " pop";
    } });
    for (k = 0; k < st.length; k++) if (know[k] === 1 && st[k] !== 1 && !cat[k]) { st[k] = 1; paintCell(k); }
    for (var v = 0; v < vels.length; v++) paintV(v);
    play(count > 3 ? [523, 659, 784] : [660], 0.07, 0.12);
    msgEl.className = "msg"; msgEl.innerHTML = count > 3 ? "ぱっと " + count + "マス ひらきました" : "";
    checkWin();
  }

  function flashCorners(i) {
    var vs = cVerts(i), k;
    for (k = 0; k < vs.length; k++) if (vels[vs[k]] && vis[vs[k]]) vels[vs[k]].className += " lit";
    setTimeout(function () { paintAround(i); }, 1600);
  }
  function paintAround(i) { var vs = cVerts(i); for (var k = 0; k < vs.length; k++) paintV(vs[k]); }

  function toggleMark(i) {
    if (!alive || st[i] === 1 || st[i] === 3) return;
    st[i] = st[i] === 2 ? 0 : 2;
    paintCell(i); cells[i].className += " pop";
    play([880], 0.05, 0.08);
    paintScore(); paintAround(i);
  }

  function checkWin() {
    for (var i = 0; i < st.length; i++) if (!cat[i] && st[i] !== 1) return;
    alive = false; stopClock();
    var key = "best-" + lv.key, best = Number(load(key, "0")) || 0, nb = best === 0 || sec < best;
    if (nb) save(key, sec);
    for (i = 0; i < st.length; i++) if (cat[i] && st[i] !== 3) { st[i] = 2; }
    for (i = 0; i < cells.length; i++) {
      if (!cat[i]) continue;
      cells[i].firstChild.innerHTML = "😺";
      (function (el, d) { setTimeout(function () { el.className = "c cat pop"; }, d); })(cells[i], 60 * i % 900);
    }
    play([523, 659, 784, 1047], 0.14, 0.18);
    msgEl.className = "msg";
    msgEl.innerHTML = "できました！ " + sec + "びょう" + (nb ? (best ? "　あたらしい きろく！" : "　はじめての きろく！") : "　さいこうは " + best + "びょう");
  }
  function lose() {
    alive = false; stopClock();
    paintAll();
    msgEl.className = "msg bad"; msgEl.innerHTML = "ハートが なくなりました。もういちど どうぞ";
  }

  function hint() {
    if (!alive) return;
    if (!started) { msgEl.className = "msg"; msgEl.innerHTML = "さいしょは どこを さわっても だいじょうぶ"; return; }
    var know = [], i;
    for (i = 0; i < st.length; i++) know.push(st[i] === 1 ? 1 : st[i] === 3 ? 2 : 0);
    deduce(know, vis, clue);
    var safe = [], cats = [];
    for (i = 0; i < st.length; i++) {
      if (st[i] === 1 || st[i] === 3) continue;
      if (know[i] === 1) safe.push(i);
      else if (know[i] === 2 && st[i] !== 2) cats.push(i);
    }
    var pick = safe.length ? safe[Math.floor(Math.random() * safe.length)] : cats.length ? cats[0] : -1;
    if (pick < 0) { msgEl.className = "msg"; msgEl.innerHTML = "🐈 の おきばしょを 見なおして みて"; return; }
    var el = cells[pick];
    el.className = el.className.replace(/ hint/g, "");
    void el.offsetWidth;
    el.className += " hint";
    setTimeout(function () { el.className = el.className.replace(/ hint/g, ""); }, 3300);
    msgEl.className = "msg";
    msgEl.innerHTML = safe.length ? "ひかって いる マスは ねこが いません" : "ひかって いる マスには ねこが います 🐈";
  }

  // すうじに さわると、かぞえて いる マスを ひからせる
  var litT = null, litList = [];
  function light(v) {
    unlight();
    litList = vCells(v);
    for (var k = 0; k < litList.length; k++) cells[litList[k]].className += " lit";
    if (vels[v]) vels[v].className += " lit";
    litList.v = v;
    msgEl.className = "msg";
    msgEl.innerHTML = "あしあと " + clue[v] + "つ → ひかった " + litList.length + "マスの どこかに ねこが <b>" + clue[v] + "</b> ひき";
    litT = setTimeout(unlight, 1800);
  }
  function unlight() {
    if (litT !== null) { clearTimeout(litT); litT = null; }
    for (var k = 0; k < litList.length; k++) paintCell(litList[k]);
    if (litList.v !== undefined) paintV(litList.v);
    litList = [];
  }

  // ---- ゆび ----
  var holdT = null, downAt = null, held = false;
  function target(x, y) {
    var el = document.elementFromPoint ? document.elementFromPoint(x, y) : null;
    for (var k = 0; el && k < 3; k++) {
      var c = el.getAttribute && el.getAttribute("data-c"), v = el.getAttribute && el.getAttribute("data-v");
      if (v !== null && v !== undefined && v !== "") return { v: Number(v) };
      if (c !== null && c !== undefined && c !== "") return { c: Number(c) };
      el = el.parentNode;
    }
    return null;
  }
  function down(x, y) {
    downAt = target(x, y); held = false;
    if (holdT !== null) clearTimeout(holdT);
    if (downAt && downAt.c !== undefined) {
      holdT = setTimeout(function () { holdT = null; held = true; toggleMark(downAt.c); }, 520);
    }
  }
  function up() {
    if (holdT !== null) { clearTimeout(holdT); holdT = null; }
    var t = downAt; downAt = null;
    if (!t || held) return;
    if (t.v !== undefined) { if (vis[t.v]) light(t.v); return; }
    if (mode === "mark") toggleMark(t.c); else openCell(t.c);
  }
  function move(x, y) {
    if (!downAt) return;
    var t = target(x, y);
    if (!t || t.c !== downAt.c || t.v !== downAt.v) { if (holdT !== null) { clearTimeout(holdT); holdT = null; } downAt = null; }
  }
  boardEl.ontouchstart = function (e) { var t = e.touches[0]; down(t.clientX, t.clientY); if (e.preventDefault) e.preventDefault(); return false; };
  boardEl.ontouchmove = function (e) { var t = e.touches[0]; move(t.clientX, t.clientY); if (e.preventDefault) e.preventDefault(); return false; };
  boardEl.ontouchend = function (e) { up(); if (e.preventDefault) e.preventDefault(); return false; };
  boardEl.ontouchcancel = function () { downAt = null; if (holdT !== null) { clearTimeout(holdT); holdT = null; } };
  boardEl.onmousedown = function (e) { down(e.clientX, e.clientY); return false; };
  boardEl.onmousemove = function (e) { if (downAt) move(e.clientX, e.clientY); };
  boardEl.onmouseup = function () { up(); };
  boardEl.oncontextmenu = function () { return false; };

  function tap(el, fn) {
    var t = false;
    el.ontouchend = function (e) { t = true; if (e.preventDefault) e.preventDefault(); fn(); return false; };
    el.onclick = function () { if (t) { t = false; return; } fn(); };
  }
  function setMode(m) { mode = m; $("m-open").className = "big" + (m === "open" ? " on" : ""); $("m-mark").className = "big" + (m === "mark" ? " on" : ""); }
  tap($("m-open"), function () { setMode("open"); });
  tap($("m-mark"), function () { setMode("mark"); });
  tap($("hint"), hint);
  tap($("reset"), build);
  (function () {
    var host = $("levels");
    for (var i = 0; i < LEVELS.length; i++) {
      (function (L) {
        var b = document.createElement("button");
        b.type = "button"; b.className = "big" + (L === lv ? " on" : ""); b.innerHTML = L.label;
        b.setAttribute("data-k", L.key);
        tap(b, function () {
          lv = L; save("level", L.key);
          var bs = host.getElementsByTagName("button");
          for (var k = 0; k < bs.length; k++) bs[k].className = "big" + (bs[k].getAttribute("data-k") === L.key ? " on" : "");
          build();
        });
        host.appendChild(b);
      })(LEVELS[i]);
    }
  })();
  window.onresize = function () { if (cells) { layout(); paintAll(); } };

  // ルールの 絵を つくる。ほんとうの ばんと おなじ 見た目で
  function demo(host, w, h, catsAt) {
    var c = 48, d = 26, i, v, k, el, has = {};
    host.style.width = (w * c) + "px"; host.style.height = (h * c) + "px";
    host.style.margin = "10px 14px";
    for (i = 0; i < catsAt.length; i++) has[catsAt[i]] = 1;
    for (i = 0; i < w * h; i++) {
      el = document.createElement("div");
      el.className = "c" + (has[i] ? " cat" : " open");
      el.style.left = ((i % w) * c + 2) + "px"; el.style.top = (Math.floor(i / w) * c + 2) + "px";
      el.style.width = (c - 4) + "px"; el.style.height = (c - 4) + "px";
      if (has[i]) el.innerHTML = "🐱";
      host.appendChild(el);
    }
    for (v = 0; v < (w + 1) * (h + 1); v++) {
      var vr = Math.floor(v / (w + 1)), vc = v % (w + 1), n = 0;
      for (k = 0; k < catsAt.length; k++) {
        var r = Math.floor(catsAt[k] / w), cc = catsAt[k] % w;
        if ((vr === r || vr === r + 1) && (vc === cc || vc === cc + 1)) n++;
      }
      if (!n) continue;
      el = document.createElement("div");
      el.className = "v";
      var bx = pawBox(n, d);
      el.style.width = bx.w + "px"; el.style.height = bx.h + "px";
      el.style.left = (vc * c - bx.w / 2) + "px"; el.style.top = (vr * c - bx.h / 2) + "px";
      el.innerHTML = bx.html;
      host.appendChild(el);
    }
  }
  demo($("demo1"), 3, 3, [4]);
  demo($("demo2"), 4, 3, [5, 6]);
  window.kdState = function () { return { W: W, H: H, cat: cat.slice(0), st: st.slice(0), vis: vis.slice(0), clue: clue.slice(0), alive: alive, hearts: hearts, msg: msgEl.textContent }; };
  build();
})();
</script>
</body>
</html>
